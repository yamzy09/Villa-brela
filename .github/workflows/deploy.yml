name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/known_hosts << 'EOF'
          |1|ePUUCCNOhAdtoNZoyB2DGzzZlNQ=|9+SOWnQX8elecbR29HXKs21qzrk= ssh-rsa 
          |1|j6DyM6hb5kvSH1b21RurE7EZFFs=|s9tbEyBxoIwW2S2KdMEZNCWp3UQ= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBD7d0M5uAkDfGx7awJxJTMbM/NYnIdK4/YpMLYGep3jGfI5SS4hNkKqsamm9DCN2mIBBVIXtcpUvipwoFLdZBuw=
          |1|j4hUyKIW+RwDzVy5AWdmQzK1BQo=|oIMCZvIkfSfTYiKww9DN33ubW1Q= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICA2NmC40lemAMBQ6UVCTxtnuk3lillgyPc1OzTkwcbg
          EOF
          ssh -i ~/.ssh/deploy_key root@51.178.54.151 "bash /var/www/villa-brela-sunset.com/deploy.sh"
