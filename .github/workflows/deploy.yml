  name: Deploy to Production

  on:
    push:
      branches:
        - main

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Deploy via SSH
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: 51.178.54.151
            username: root
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script: bash /var/www/villa-brela-sunset.com/deploy.sh
